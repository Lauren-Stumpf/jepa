# E27: water, 10% of the labels, seed 1: 2,000 epochs from the encoder of the 400-epoch baseline
# Generated by scripts/make_e26_e27.py from jepa_finetune_plain_water16_10pct_s1.yaml.
# Water 16 fs fine-tune of the plain pretraining on 10% of the training pairs
# Generated by scripts/make_water16_configs.py from flashmd_water16_scratch.yaml.
# From-scratch FlashMD baseline on the q-TIP4P/f liquid water pairs (data/water/parse_runs.py), 16 fs stride.
# Architecture and trainer defaults follow metatrain's FlashMD (PET backbone).
# Targets are stored mass-scaled (paper Eq. 6); evaluate with --scaled_targets.
# Run:  mtt train configs/flashmd_water16_scratch.yaml -o results/models/flashmd_water16_scratch.pt
seed: 1
device: gpu
base_precision: 32

wandb:
  project: jepa-flashmd-experiments
  name: e27_restart_2000ep_water16_10pct_s1
  group: E27
  job_type: restart-2000ep

architecture:
  name: experimental.flashmd
  atomic_types: [1, 8]
  model:
    cutoff: 4.5
    d_pet: 128
    d_node: 512
    num_gnn_layers: 3
    num_attention_layers: 2
    predict_momenta_as_difference: false   # large stride: predict momenta directly (paper)
  training:
    timestep: 16           # fs; copy this file and change timestep + paths for the 1 fs and 4 fs sets
    masses: {1: 1.00794, 8: 15.9994}  # i-PI masses (m_e units in the checkpoint / 1822.888486)
    batch_size: 16
    num_epochs: 2000         # E27 control: 112,000 labelled steps after 22,400 labelled steps (stage 1): 134,400 in total
    learning_rate: 3.0e-4   # paper, App. B.1
    warmup_fraction: 0.01
    log_interval: 1
    checkpoint_interval: 200  # E27: few checkpoints (disk); results use model.pt
    finetune:
      read_from: /storage3/lauren/code/jepa/results/runs/e27_restart_encoder_water16/pretrained.ckpt   # encoder of the baseline trained with labels for 400 epochs (E27 control with two learning-rate cycles)
      method: full            # every weight trains, same as the baseline
    loss:
      position: {type: mse, weight: 1.0, reduction: mean}
      momentum: {type: mse, weight: 1.0, reduction: mean}

training_set:
  systems:
    read_from: data/water/pairs/16fs/train_10pct.xyz
    length_unit: A
  targets:
    position:
      key: future_positions
      quantity: length
      unit: A
      type: {cartesian: {rank: 1}}
      sample_kind: atom
    momentum:
      key: future_momenta
      quantity: momentum
      unit: (eV*u)^(1/2)
      type: {cartesian: {rank: 1}}
      sample_kind: atom

validation_set:
  systems:
    read_from: data/water/pairs/16fs/val.xyz
    length_unit: A
  targets:
    position:
      key: future_positions
      quantity: length
      unit: A
      type: {cartesian: {rank: 1}}
      sample_kind: atom
    momentum:
      key: future_momenta
      quantity: momentum
      unit: (eV*u)^(1/2)
      type: {cartesian: {rank: 1}}
      sample_kind: atom

test_set:
  systems:
    read_from: data/water/pairs/16fs/test.xyz
    length_unit: A
  targets:
    position:
      key: future_positions
      quantity: length
      unit: A
      type: {cartesian: {rank: 1}}
      sample_kind: atom
    momentum:
      key: future_momenta
      quantity: momentum
      unit: (eV*u)^(1/2)
      type: {cartesian: {rank: 1}}
      sample_kind: atom
