# Baseline on 10% of the organic training frames, seed 2 (data-efficiency comparison).
# Architecture and trainer defaults follow metatrain's FlashMD (PET backbone).
# Targets in data/organic8 are stored mass-scaled (paper Eq. 6); evaluate with --scaled_targets.
# Run:  mtt train configs/flashmd_organic8_scratch.yaml -o results/models/flashmd_organic8_scratch.pt
seed: 2
device: gpu
base_precision: 32

wandb:
  project: jepa-flashmd
  name: flashmd_organic8_scratch_10pct_s2

architecture:
  name: experimental.flashmd
  atomic_types: [1, 6, 7, 8]
  model:
    cutoff: 4.5
    d_pet: 128
    d_node: 512
    num_gnn_layers: 3
    num_attention_layers: 2
    predict_momenta_as_difference: false   # large stride: predict momenta directly (paper)
  training:
    timestep: 8            # fs; the Zenodo file is the 8 fs stride
    masses: {1: 1.00794, 6: 12.0107, 7: 14.00674, 8: 15.9994}  # i-PI masses used to generate the file
    batch_size: 16
    num_epochs: 100          # first comparison: same budget for baseline and fine-tuned model, finishes within a day
    learning_rate: 3.0e-4   # paper, App. B.1
    warmup_fraction: 0.01
    log_interval: 1
    checkpoint_interval: 10  # every 10th epoch (disk, 12 Nov 2026); selection with the energy criterion is done afterwards on this grid
    loss:
      position: {type: mse, weight: 1.0, reduction: mean}
      momentum: {type: mse, weight: 1.0, reduction: mean}

training_set:
  systems:
    read_from: data/organic8/train_10pct.xyz
    length_unit: A
  targets:
    position:
      key: future_positions
      quantity: length
      unit: A
      type: {cartesian: {rank: 1}}
      sample_kind: atom
    momentum:
      key: future_momenta
      quantity: momentum
      unit: (eV*u)^(1/2)
      type: {cartesian: {rank: 1}}
      sample_kind: atom

validation_set:
  systems:
    read_from: data/organic8/val.xyz
    length_unit: A
  targets:
    position:
      key: future_positions
      quantity: length
      unit: A
      type: {cartesian: {rank: 1}}
      sample_kind: atom
    momentum:
      key: future_momenta
      quantity: momentum
      unit: (eV*u)^(1/2)
      type: {cartesian: {rank: 1}}
      sample_kind: atom

test_set:
  systems:
    read_from: data/organic8/test.xyz
    length_unit: A
  targets:
    position:
      key: future_positions
      quantity: length
      unit: A
      type: {cartesian: {rank: 1}}
      sample_kind: atom
    momentum:
      key: future_momenta
      quantity: momentum
      unit: (eV*u)^(1/2)
      type: {cartesian: {rank: 1}}
      sample_kind: atom
